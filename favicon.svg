<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dfd8"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0c0d14"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.6"/>
  <!-- Beaker / Flask Icon -->
  <path d="M42 22 L58 22 M50 22 L50 36 L68 68 C72 74 68 80 60 80 L40 80 C32 80 28 74 32 68 L50 36" 
        fill="none" stroke="url(#neonGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Bubbles inside flask -->
  <circle cx="46" cy="66" r="3" fill="#00dfd8"/>
  <circle cx="56" cy="60" r="2.5" fill="#ff0080"/>
  <circle cx="50" cy="72" r="2" fill="#7928ca"/>
  <!-- Atom ring / Sparkle -->
  <path d="M68 28 L72 32 M72 28 L68 32" stroke="#00dfd8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="78" cy="22" r="2.5" fill="#00dfd8"/>
</svg>
